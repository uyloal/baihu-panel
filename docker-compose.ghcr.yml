services:
  baihu:
    image: ghcr.io/uyloal/baihu:latest
    container_name: baihu
    ports:
      - "8052:8052"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    environment:
      - TZ=Asia/Shanghai
      # 以下环境变量可选（开箱即用 SQLite，如需自定义可取消注释）：
      # - BH_SERVER_PORT=8052
      # - BH_SERVER_HOST=0.0.0.0
      # - BH_SERVER_URL_PREFIX=/baihu  # 可选：反向代理子路径
      # - BAIHU_SECRET_KEY=your_secret_key_for_secrets  # 机密数据加密秘钥 (建议配置)
      # - BH_DB_TYPE=mysql
      # - BH_DB_HOST=localhost
      # - BH_DB_PORT=3306
      # - BH_DB_USER=root
      # - BH_DB_PASSWORD=password
      # - BH_DB_NAME=baihu
      # - BH_DB_TABLE_PREFIX=baihu_
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

